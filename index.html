<!DOCTYPE html>
<html>
<head>
    <title>Luma Pulse Decoder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        video { width: 100%; height: auto; }
        #status { font-size: 24px; font-weight: bold; margin-top: 20px; color: #0f0; }
        #btn { display:none; margin: 20px auto; padding: 20px 40px; background: white; color: black; border-radius: 10px; font-weight: bold; }
        canvas { display: none; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>
    <div id="status">VİDEOYA ODAKLAN...</div>
    <div id="btn" onclick="openStore()">SATIN AL</div>

<script>
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');
    
    let lastLuma = 0;
    let peaks = [];
    let currentLink = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

    function analyze() {
        canvas.width = video.videoWidth / 4;
        canvas.height = video.videoHeight / 4;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Merkezin parlaklığını ölç
        const data = ctx.getImageData(canvas.width/2, canvas.height/2, 10, 10).data;
        let avgLuma = 0;
        for(let i=0; i<data.length; i+=4) {
            avgLuma += (data[i] + data[i+1] + data[i+2]) / 3;
        }
        avgLuma /= (data.length / 4);

        // Parlaklık değişimini takip et (Nabız yakalama)
        if (avgLuma > lastLuma + 1) { // Eğer ışık arttıysa
            peaks.push(Date.now());
        }
        lastLuma = avgLuma;

        // Son 1 saniyedeki tepe noktalarını say (Frekansı bul)
        const now = Date.now();
        peaks = peaks.filter(p => now - p < 1000);
        let freq = peaks.length;

        // Marka Tespit Mantığı
        if (freq >= 8 && freq <= 12) { updateUI("NIKE", "https://nike.com"); }
        else if (freq >= 4 && freq <= 6) { updateUI("ADIDAS", "https://adidas.com"); }
        else if (freq >= 1 && freq <= 3) { updateUI("SNEAKS UP", "https://sneaksup.com"); }
        
        requestAnimationFrame(analyze);
    }

    function updateUI(name, url) {
        status.innerText = "TESPİT EDİLDİ: " + name;
        btn.style.display = "block";
        currentLink = url;
    }

    function openStore() { window.open(currentLink, '_blank'); }
    
    video.onplay = () => analyze();
</script>
</body>
</html>
