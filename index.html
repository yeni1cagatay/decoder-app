<!DOCTYPE html>
<html>
<head>
    <title>Shop the Show - Noise Decoder</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                   width: 250px; height: 250px; border: 2px solid #0f0; box-shadow: 0 0 15px #0f0; pointer-events: none; }
        #status-bar { position: absolute; top: 20px; width: 100%; font-size: 14px; background: rgba(0,0,0,0.6); padding: 5px; }
        #result-card { position: absolute; bottom: 40px; left: 10%; width: 80%; background: #fff; color: #000; 
                       padding: 20px; border-radius: 20px; display: none; transition: 0.3s; }
        button { background: #000; color: #fff; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div id="container">
    <div id="status-bar">Sistem Başlatılıyor...</div>
    <video id="videoInput" autoplay playsinline></video>
    <div id="overlay">VİDEOYA ODAKLAN</div>
    
    <div id="result-card">
        <h2 id="brand-name">Marka Bulundu!</h2>
        <button id="shop-btn">HEMEN SATIN AL</button>
    </div>
</div>

<script>
    const brandData = {
        1010: { name: "NIKE", url: "https://www.nike.com/tr/" },
        2020: { name: "ADIDAS", url: "https://www.adidas.com.tr/tr" },
        3030: { name: "SNEAKS UP", url: "https://www.sneaksup.com/" }
    };

    // Python'daki np.random.seed(seed) mantığının JavaScript versiyonu
    function seededRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    function generateMask(seed, rows, cols) {
        let mask = new cv.Mat(rows, cols, cv.CV_32F);
        let s = seed;
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                // +1 veya -1 üret (Python'daki gibi)
                let val = seededRandom(s++) > 0.5 ? 1 : -1;
                mask.floatPtr(i, j)[0] = val;
            }
        }
        return mask;
    }

    let video = document.getElementById('videoInput');
    let status = document.getElementById('status-bar');
    let card = document.getElementById('result-card');
    let brandText = document.getElementById('brand-name');
    let shopBtn = document.getElementById('shop-btn');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", focusMode: "continuous" } })
        .then(stream => { video.srcObject = stream; });

    cv['onRuntimeInitialized'] = () => {
        status.innerText = "Sistem Hazır. Ekrandaki videoya yaklaş.";
        startAnalysis();
    };

    function startAnalysis() {
        let cap = new cv.VideoCapture(video);
        let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let highFreq = new cv.Mat();
        
        // Maskeleri önceden hazırla (Hücre boyutunu 200x200 yapıyoruz, mobil performans için)
        const analysisSize = 200;
        let masks = {};
        Object.keys(brandData).forEach(seed => {
            masks[seed] = generateMask(parseInt(seed), analysisSize, analysisSize);
        });

        function process() {
            try {
                cap.read(src);
                // Merkez bölgeyi kırp (ROI)
                let rect = new cv.Rect((src.cols/2) - (analysisSize/2), (src.rows/2) - (analysisSize/2), analysisSize, analysisSize);
                let roi = src.roi(rect);
                
                cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
                gray.convertTo(gray, cv.CV_32F);
                
                // High-pass filter (Görüntüyü temizle, gürültüyü bırak)
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                cv.subtract(gray, blurred, highFreq);

                let bestID = null;
                let maxCorr = -1;

                // Korelasyon Kontrolü
                Object.keys(masks).forEach(seed => {
                    let corr = 0;
                    // Basitleştirilmiş nokta çarpımı
                    for (let i = 0; i < analysisSize; i+=5) { // Performans için 5 pikselde bir bak
                        for (let j = 0; j < analysisSize; j+=5) {
                            corr += highFreq.floatPtr(i, j)[0] * masks[seed].floatPtr(i, j)[0];
                        }
                    }
                    
                    if (corr > maxCorr) {
                        maxCorr = corr;
                        bestID = seed;
                    }
                });

                // Eşik değeri (MVP için deneysel bir değer)
                if (maxCorr > 800) { 
                    showUI(bestID);
                } else {
                    status.innerText = "Sinyal Aranıyor... (Güç: " + Math.round(maxCorr) + ")";
                }

                roi.delete();
            } catch (e) { console.log(e); }
            requestAnimationFrame(process);
        }
        process();
    }

    function showUI(id) {
        let item = brandData[id];
        brandText.innerText = item.name;
        card.style.display = "block";
        shopBtn.onclick = () => window.open(item.url, '_blank');
        status.innerText = "MARKA BULUNDU!";
    }
</script>
</body>
</html>
