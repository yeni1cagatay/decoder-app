<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Shop the Show - DNA Decoder</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- OpenCV.js: Görüntü işleme beyni -->
    <script src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        video { width: 100%; height: 100vh; object-fit: cover; opacity: 0.5; }
        
        /* Vizör (Merkezleme Çerçevesi) */
        #vizor { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: 200px; border: 2px solid #0f0; border-radius: 15px;
            box-shadow: 0 0 20px #0f0; pointer-events: none;
        }
        #vizor::after { content: "MERKEZE ODAKLAN"; position: absolute; bottom: -30px; left: 0; width: 100%; font-size: 12px; color: #0f0; }

        /* Satın Al Kartı */
        #nike-card { 
            position: absolute; bottom: 50px; left: 10%; width: 80%; 
            background: white; color: black; padding: 25px; border-radius: 25px; 
            display: none; box-shadow: 0 0 40px rgba(0,255,0,1); animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
        
        button { background: #ff0000; color: #fff; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 20px; }
        #status { position: absolute; top: 20px; width: 100%; font-size: 14px; color: #0f0; }
    </style>
</head>
<body>

<div id="status">Sistem Hazırlanıyor...</div>
<video id="videoInput" autoplay playsinline></video>
<div id="vizor"></div>

<div id="nike-card">
    <h1 style="margin:0 0 10px 0;">NIKE ÜRÜNÜ!</h1>
    <button onclick="window.open('https://nike.com/tr', '_blank')">HEMEN SATIN AL</button>
</div>

<script>
    // ==========================================================
    // ⚠️ PATRON BURAYA DİKKAT: 
    // Colab'ın sana verdiği [1, -1, 1...] şeklindeki listeyi 
    // aşağıdaki köşeli parantezlerin içine kopyala-yapıştır yap.
    // ==========================================================
    const nikeDNA = []; // <--- LİSTEYİ BURAYA KOY (Örn: [1,-1,1...])
    // ==========================================================

    let video = document.getElementById('videoInput');
    let status = document.getElementById('status');
    let card = document.getElementById('nike-card');

    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment", width: 1280, height: 720 }, 
        audio: false 
    }).then(s => { video.srcObject = s; });

    cv['onRuntimeInitialized'] = () => {
        status.innerText = "SİSTEM AKTİF: Videonun Ortasına Tut";
        processVideo();
    };

    function processVideo() {
        let cap = new cv.VideoCapture(video);
        let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        let gray = new cv.Mat(), blurred = new cv.Mat(), highFreq = new cv.Mat();

        function detect() {
            try {
                cap.read(src);
                // Merkezdeki 100x100 piksellik alanı kesip al
                let rect = new cv.Rect((src.cols/2)-50, (src.rows/2)-50, 100, 100);
                let roi = src.roi(rect);
                
                cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
                gray.convertTo(gray, cv.CV_32F);
                
                // Filtreleme: Filmi sil, gürültüyü parlat
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                cv.subtract(gray, blurred, highFreq);

                let score = 0;
                // DNA Eşleştirmesi (Piksel piksere çarpım)
                for(let i = 0; i < 100; i++) {
                    // Kameradan gelen piksel ile senin DNA'nı çarpıştırıyoruz
                    let pixelVal = highFreq.floatPtr(i, i)[0];
                    score += pixelVal * nikeDNA[i];
                }

                // Sinyal Gücü Eşiği (Balyoz şiddeti 60 olduğu için 500 skor rahat geçilir)
                if (score > 500) {
                    status.innerText = "TESPİT EDİLDİ! (Güç: " + Math.round(score) + ")";
                    card.style.display = "block";
                } else {
                    status.innerText = "Sinyal Aranıyor... (" + Math.round(score) + ")";
                }
                
                roi.delete();
            } catch(e) {}
            requestAnimationFrame(detect);
        }
        detect();
    }
</script>

</body>
</html>
