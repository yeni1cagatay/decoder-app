<!DOCTYPE html>
<html>
<head>
    <title>Layer Decoder App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Görüntü işleme kütüphanesini yüklüyoruz -->
    <script src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; text-align: center; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #scanner-box { position: absolute; width: 70%; height: 30%; border: 3px dashed #00ff00; border-radius: 15px; pointer-events: none; }
        #info-card { position: absolute; bottom: 40px; background: white; color: black; padding: 20px; border-radius: 20px; width: 80%; display: none; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
        button { background: #ff0000; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 18px; margin-top: 10px; cursor: pointer; }
        #status { position: absolute; top: 20px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div id="container">
    <div id="status">Kamera Hazırlanıyor...</div>
    <video id="videoInput" autoplay playsinline></video>
    <div id="scanner-box"></div>
    
    <div id="info-card">
        <h2 id="brand-name">Marka Tespit Edildi!</h2>
        <button id="shop-btn">HEMEN SATIN AL</button>
    </div>
</div>

<script>
    const urlDB = {
        10: { name: "NIKE", url: "https://www.nike.com/tr/" },
        20: { name: "ADIDAS", url: "https://www.adidas.com.tr/tr" },
        30: { name: "SNEAKS UP", url: "https://www.sneaksup.com/" }
    };

    let video = document.getElementById('videoInput');
    let infoCard = document.getElementById('info-card');
    let brandName = document.getElementById('brand-name');
    let shopBtn = document.getElementById('shop-btn');
    let status = document.getElementById('status');

    // Kamerayı aç
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then(s => { video.srcObject = s; })
        .catch(e => { status.innerText = "Kamera hatası!"; });

    // Sistem hazır olduğunda
    cv['onRuntimeInitialized'] = () => {
        status.innerText = "Sistem Aktif: Videoya Odaklan";
        processFrame();
    };

    function processFrame() {
        let cap = new cv.VideoCapture(video);
        let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        let cell = 40;

        function analyze() {
            try {
                cap.read(src);
                let centerX = src.cols / 2;
                let centerY = src.rows / 2;

                let bits = "";
                // 2x4'lük veri bloğunu merkezden oku
                for (let r = 0; r < 2; r++) {
                    for (let c = 0; c < 4; c++) {
                        let x = (centerX - (2 * cell)) + (c * cell);
                        let y = (centerY - cell) + (r * cell);
                        let pixel = src.ucharPtr(y + (cell/2), x + (cell/2));
                        
                        // Mavi kanal baskınlık formülü (Alamet-i Farika)
                        let diff = pixel[2] - (pixel[0] + pixel[1]) / 2;
                        bits += (diff > 0.1) ? "1" : "0";
                    }
                }

                let id = parseInt(bits, 2);
                if (urlDB[id]) {
                    brandName.innerText = urlDB[id].name;
                    infoCard.style.display = "block";
                    shopBtn.onclick = () => window.open(urlDB[id].url, '_blank');
                }
            } catch (e) {}
            requestAnimationFrame(analyze);
        }
        analyze();
    }
</script>

</body>
</html>
