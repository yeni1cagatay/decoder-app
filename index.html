<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Shop the Show - Ultimate Noise Decoder</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- OpenCV.js: Teknolojinin beyni -->
    <script src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        
        /* Tarama Çerçevesi */
        #scanner-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border: 2px solid #0f0;
            box-shadow: 0 0 20px #0f0; border-radius: 10px; pointer-events: none;
        }
        #scanner-overlay::after {
            content: "SİNYAL TARANIYOR..."; position: absolute; bottom: -30px; left: 0; width: 100%; font-size: 12px;
        }

        /* Bilgi Kartı (Ürün Bulunduğunda Açılır) */
        #result-card { 
            position: absolute; bottom: 50px; left: 10%; width: 80%; 
            background: white; color: black; padding: 20px; border-radius: 20px; 
            display: none; box-shadow: 0 0 30px rgba(0,255,0,0.8); animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
        
        #shop-btn { 
            background: #000; color: #fff; border: none; padding: 15px 30px; 
            border-radius: 10px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer;
        }
        #status { position: absolute; top: 20px; font-size: 14px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px; }
    </style>
</head>
<body>

<div id="container">
    <div id="status">Sistem Başlatılıyor...</div>
    <video id="videoInput" autoplay playsinline></video>
    <div id="scanner-overlay"></div>
    
    <div id="result-card">
        <h2 id="brand-name">MARKA BULUNDU!</h2>
        <button id="shop-btn">HEMEN SATIN AL</button>
    </div>
</div>

<script>
    // --- VERİTABANI: ID'ler ve URL'ler ---
    const brandData = {
        1010: { name: "NIKE", url: "https://www.nike.com/tr/" },
        2020: { name: "ADIDAS", url: "https://www.adidas.com.tr/tr" },
        3030: { name: "SNEAKS UP", url: "https://www.sneaksup.com/" }
    };

    // Python'daki np.random.seed mantığının aynısı (Kritik!)
    function seededRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    let video = document.getElementById('videoInput');
    let status = document.getElementById('status');
    let card = document.getElementById('result-card');
    let brandText = document.getElementById('brand-name');
    let shopBtn = document.getElementById('shop-btn');

    // Kamera Erişimi
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { status.innerText = "Kamera Hatası!"; });

    // OpenCV Hazır Olduğunda
    cv['onRuntimeInitialized'] = () => {
        status.innerText = "Sistem Aktif. Videoya Odaklan.";
        processVideo();
    };

    function processVideo() {
        let cap = new cv.VideoCapture(video);
        let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let highFreq = new cv.Mat();

        const analysisSize = 100; // Analiz edilen alan (Hız için 100x100)

        function scan() {
            try {
                cap.read(src);
                
                // Merkeze odaklan
                let rect = new cv.Rect((src.cols/2) - (analysisSize/2), (src.rows/2) - (analysisSize/2), analysisSize, analysisSize);
                let roi = src.roi(rect);
                
                cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
                gray.convertTo(gray, cv.CV_32F);
                
                // High-Pass Filter: Videoyu sil, gürültüyü bırak
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                cv.subtract(gray, blurred, highFreq);

                let bestID = null;
                let maxScore = -1;

                // Her markanın "parmak izini" videodakiyle çarp (Korelasyon)
                [1010, 2020, 3030].forEach(seed => {
                    let score = 0;
                    let s = seed;
                    for (let i = 0; i < analysisSize; i += 5) { // Örnekleme hızı
                        for (let j = 0; j < analysisSize; j += 5) {
                            let maskVal = seededRandom(s++) > 0.5 ? 1 : -1;
                            score += highFreq.floatPtr(i, j)[0] * maskVal;
                        }
                    }

                    if (score > maxScore) {
                        maxScore = score;
                        bestID = seed;
                    }
                });

                // HASSASİYET EŞİĞİ: 800 (Eğer okumazsa 500'e indir)
                if (maxScore > 800) {
                    showProduct(bestID);
                } else {
                    status.innerText = "Sinyal Aranıyor... Güç: " + Math.round(maxScore);
                }

                roi.delete();
            } catch (err) { console.log(err); }
            requestAnimationFrame(scan);
        }
        scan();
    }

    function showProduct(id) {
        let item = brandData[id];
        brandText.innerText = item.name;
        card.style.display = "block";
        shopBtn.onclick = () => window.open(item.url, '_blank');
        status.innerText = "TESPİT EDİLDİ!";
    }
</script>

</body>
</html>
