<!DOCTYPE html>
<html>
<head>
    <title>Light Scanner Decoder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        video { width: 100%; height: auto; border-bottom: 2px solid #333; }
        #status { font-size: 20px; font-weight: bold; margin-top: 20px; color: #0f0; }
        #btn { display:none; margin: 20px auto; padding: 20px; background: white; color: black; border-radius: 15px; font-weight: bold; width: 80%; }
        canvas { display: none; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>
    <div id="status">SİNYAL ARANIYOR...</div>
    <div id="btn" onclick="openStore()">SATIN AL</div>

<script>
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');
    let currentURL = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

    function getAvgLight(x, y, w, h) {
        const data = ctx.getImageData(x, y, w, h).data;
        let sum = 0;
        for(let i=0; i<data.length; i+=4) sum += (data[i] + data[i+1] + data[i+2]) / 3;
        return sum / (data.length / 4);
    }

    function scan() {
        if(video.paused || video.ended) return;
        // Hız için görüntüyü küçük bir tuvale çiziyoruz
        canvas.width = 100; canvas.height = 75;
        ctx.drawImage(video, 0, 0, 100, 75);

        // Ekranın Sol Üst ve Sağ Üst ışığını ölç
        let leftSide = getAvgLight(0, 0, 40, 30);
        let rightSide = getAvgLight(60, 0, 40, 30);
        
        // Karşılaştırma yap
        let diff = leftSide - rightSide;

        if (diff > 5) { // Sol taraf daha parlaksa
            update("NIKE", "https://nike.com/tr");
        } else if (diff < -5) { // Sağ taraf daha parlaksa
            update("ADIDAS", "https://adidas.com.tr");
        } else if (leftSide > 150 && rightSide > 150) { // Her ikisi de çok parlaksa
            update("SNEAKS UP", "https://sneaksup.com");
        }

        requestAnimationFrame(scan);
    }

    function update(name, url) {
        status.innerText = "TESPİT: " + name;
        btn.style.display = "block";
        btn.innerText = name + " SATIN AL";
        currentURL = url;
    }

    function openStore() { window.open(currentURL, '_blank'); }
    video.onplay = () => scan();
</script>
</body>
</html>
